name: Analog Design Studio

on:
  push:
    branches: ['main', 'feature/analog-design-studio-mvp']
    paths:
      - 'web/analog-design-studio/**'
      - '.github/workflows/analog-design-studio.yml'
  pull_request:
    paths:
      - 'web/analog-design-studio/**'
      - '.github/workflows/analog-design-studio.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/analog-design-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/analog-design-studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
