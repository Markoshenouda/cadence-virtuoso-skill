name: Analog Design Studio

on:
  push:
    branches: ['feature/analog-design-studio-mvp']
  pull_request:
    paths:
      - 'web/analog-design-studio/**'
      - '.github/workflows/analog-design-studio.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/analog-design-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
