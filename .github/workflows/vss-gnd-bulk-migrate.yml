name: VSS to analogLib GND bulk migration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.pull_request.head.sha, '') && !contains(github.event.head_commit.message, '[skip vss-gnd]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Run strict migration and validation
        run: python tools/migrate_vss_gnd.py

      - name: Remove temporary migration tooling
        run: rm -f tools/migrate_vss_gnd.py .github/workflows/vss-gnd-bulk-migrate.yml

      - name: Commit canonical changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical tools/migrate_vss_gnd.py .github/workflows/vss-gnd-bulk-migrate.yml
          if git diff --cached --quiet; then
            echo "No canonical changes were required."
            exit 0
          fi
          git commit -m "Update canonical VSS sources to analogLib GND [skip vss-gnd]"
          git push origin HEAD:${{ github.head_ref }}
