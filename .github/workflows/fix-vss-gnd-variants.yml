name: Fix canonical VSS variants

on:
  push:
    branches: [vss-gnd-bulk-update]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip vss-gnd]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix known non-legacy VDC variants
        shell: python
        run: |
          from pathlib import Path
          import re

          TARGETS = [
              Path('canonical/folded-cascode-ota/Folded_Cascode_OTA_NMOS_TotalW_V1_20260814.il'),
              Path('canonical/telescopic-ota/Telescopic_OTA_NMOS_Diff_TotalW_V7_VDC_InputBias_OutputPins_20260812.il'),
              Path('canonical/telescopic-ota/Telescopic_OTA_NMOS_Diff_TotalW_V8_VDC_InputBias_OutputPins_20260813.il'),
          ]

          changed=[]
          for path in TARGETS:
              text=path.read_text(encoding='utf-8')
              original=text
              matches=list(re.finditer(r'procedure\\((\\w+)_CreateVDC\\(([^)]*)\\)', text))
              if not matches:
                  raise SystemExit(f'{path}: no CreateVDC procedure found')

              prefixes=[]
              for m in reversed(matches):
                  prefix=m.group(1)
                  args=m.group(2).strip()
                  start=m.start()
                  next_proc=text.find('\\nprocedure(',m.end())
                  end=len(text) if next_proc<0 else next_proc
                  block=text[start:end]
                  prefixes.append(prefix)

                  if 'wm=schCreateWire' not in block or '"VSS"' not in block:
                      continue

                  wire_m=re.search(r'wp=schCreateWire\\(cv "route" "full" list\\(plus ep\\) (\\w+) \\1 0\\)',block)
                  if not wire_m:
                      raise SystemExit(f'{path}: {prefix}: cannot determine PLUS wire width')
                  wire=wire_m.group(1)

                  new_args='cv master gndMaster name xy value plusNet'
                  body_m=re.search(r'let\\(\\([^\\n]*\\)\\n.*?\\n\\s+inst\\n\\s+\\)\\n\\)',block,re.S)
                  if not body_m:
                      raise SystemExit(f'{path}: {prefix}: cannot identify VDC body')

                  new_block=block.replace(f'procedure({prefix}_CreateVDC({m.group(2)})',f'procedure({prefix}_CreateVDC({new_args})',1)
                  new_body=f'''let((inst gnd plus minus ep wp)\n        inst=dbCreateInst(cv master name xy "R0")\n        unless(inst error("{prefix}: cannot create VDC %s.\\n" name))\n        {prefix}_SetVDC(inst value)\n        plus={prefix}_VDCPinCenter(inst "PLUS")\n        minus={prefix}_VDCPinCenter(inst "MINUS")\n        ep=list(car(plus) cadr(plus)+{prefix}_STUB)\n        wp=schCreateWire(cv "route" "full" list(plus ep) {wire} {wire} 0)\n        unless(wp error("{prefix}: VDC PLUS wiring failed for %s.\\n" name))\n        schCreateWireLabel(cv car(wp) ep plusNet "lowerLeft" "R0" "stick" {wire} nil)\n        gnd=dbCreateInst(cv gndMaster strcat(name "_GND") minus "R0")\n        unless(gnd error("{prefix}: cannot create GND for VDC %s.\\n" name))\n        printf("{prefix}: VDC %s = %sV PLUS=%s MINUS=GND\\n" name value plusNet)\n        inst\n    )\n)'''
                  new_block=new_block[:body_m.start()]+new_body+new_block[body_m.end():]
                  text=text[:start]+new_block+text[end:]

              if text==original:
                  raise SystemExit(f'{path}: no VSS/GND change was made')

              # Add the gndMaster symbol to the generator let-variable list first.
              if not re.search(r'let\\(\\([^\\n]*\\bgndMaster\\b[^\\n]*\\)\\n',text):
                  lm=re.search(r'let\\(\\(([^\\n]*\\bvdcMaster\\b[^\\n]*)\\)\\n',text)
                  if not lm:
                      raise SystemExit(f'{path}: no enclosing let binding with vdcMaster')
                  binding=lm.group(1)
                  binding=binding.replace('vdcMaster','vdcMaster gndMaster',1)
                  text=text[:lm.start(1)]+binding+text[lm.end(1):]

              # Add analogLib/gnd beside the existing analogLib/vdc master.
              if not re.search(r'(?m)^\\s*gndMaster=',text):
                  vm=re.search(r'(?m)^(\\s*)vdcMaster=([^\\n]+)$',text)
                  if not vm:
                      raise SystemExit(f'{path}: no vdcMaster assignment')
                  opener=vm.group(2).replace('"vdc"','"gnd"',1)
                  text=text[:vm.end()]+f'\\n{vm.group(1)}gndMaster={opener}'+text[vm.end():]

              # Update every VDC call in this generator family that lacks gndMaster.
              for prefix in sorted(set(prefixes)):
                  pattern=re.compile(rf'(?m)^(\\s*){re.escape(prefix)}_CreateVDC\\(cv vdcMaster ([^\\n]*)\\)$')
                  def repl(cm):
                      args=cm.group(2)
                      if 'gndMaster' in args:
                          return cm.group(0)
                      return f'{cm.group(1)}{prefix}_CreateVDC(cv vdcMaster gndMaster {args})'
                  text=pattern.sub(repl,text)

              path.write_text(text,encoding='utf-8')
              changed.append(str(path))

          print('FIXED:')
          for p in changed:
              print('  '+p)

      - name: Validate known VSS/GND variants
        shell: python
        run: |
          from pathlib import Path
          import re

          targets=[
              Path('canonical/folded-cascode-ota/Folded_Cascode_OTA_NMOS_TotalW_V1_20260814.il'),
              Path('canonical/telescopic-ota/Telescopic_OTA_NMOS_Diff_TotalW_V7_VDC_InputBias_OutputPins_20260812.il'),
              Path('canonical/telescopic-ota/Telescopic_OTA_NMOS_Diff_TotalW_V8_VDC_InputBias_OutputPins_20260813.il'),
          ]
          failures=[]
          for path in targets:
              text=path.read_text(encoding='utf-8')
              if 'gndMaster=' not in text:
                  failures.append(f'{path}: gndMaster missing')
              for m in re.finditer(r'procedure\\((\\w+)_CreateVDC\\(([^)]*)\\)',text):
                  prefix=m.group(1)
                  next_proc=text.find('\\nprocedure(',m.end())
                  block=text[m.start():len(text) if next_proc<0 else next_proc]
                  if 'cv master gndMaster name xy value plusNet' not in block:
                      failures.append(f'{path}: {prefix}: signature not migrated')
                  if 'strcat(name "_GND")' not in block:
                      failures.append(f'{path}: {prefix}: unique GND naming missing')
                  if 'wm=schCreateWire' in block or 'minusNet' in block or 'car(wm)' in block:
                      failures.append(f'{path}: {prefix}: MINUS wire/label remains')
                  if 'list(plus ep)' not in block:
                      failures.append(f'{path}: {prefix}: PLUS wire missing')
          if failures:
              print('VALIDATION FAILURES:')
              print('\\n'.join(failures))
              raise SystemExit(1)
          print('Known VSS/GND variants: PASS')

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical
          if git diff --cached --quiet; then
            echo "No additional canonical changes."
            exit 0
          fi
          git commit -m "Fix remaining canonical VSS GND variants [skip vss-gnd]"
          git push
