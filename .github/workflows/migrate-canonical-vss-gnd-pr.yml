name: Migrate canonical VSS sources to analogLib GND (PR)

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vss-gnd-bulk-update

      - name: Migrate canonical generators
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('canonical')
          changed=[]; failed=[]
          for path in sorted(root.rglob('*.il')):
              text=path.read_text(encoding='utf-8')
              m=re.search(r'procedure\((\w+)_CreateVDC\(cv master name xy value plusNet minusNet\)',text)
              if not m: continue
              p=m.group(1)
              sig=f'procedure({p}_CreateVDC(cv master name xy value plusNet minusNet)'
              start=text.find(sig); nxt=text.find('\nprocedure(',start+len(sig)); end=len(text) if nxt<0 else nxt
              block=text[start:end]
              body=re.search(r'let\(\(inst plus minus ep em wp wm\)\n.*?printf\("[^"\n]*VDC %s = %sV PLUS=%s MINUS=%s\\n" name value plusNet minusNet\)\n        inst\n    \)\n\)\n',block,re.S)
              if not body:
                  failed.append((str(path),'CreateVDC pattern mismatch')); continue
              new_body=f'''let((inst gnd plus minus ep wp)\n        inst=dbCreateInst(cv master name xy "R0")\n        unless(inst error("{p}: cannot create VDC %s.\\n" name))\n        {p}_SetVDC(inst value)\n        plus={p}_VDCPinCenter(inst "PLUS")\n        minus={p}_VDCPinCenter(inst "MINUS")\n        ep=list(car(plus) cadr(plus)+{p}_STUB)\n        wp=schCreateWire(cv "route" "full" list(plus ep) {p}_WIRE {p}_WIRE 0)\n        unless(wp error("{p}: VDC PLUS wiring failed for %s.\\n" name))\n        schCreateWireLabel(cv car(wp) ep plusNet "lowerLeft" "R0" "stick" {p}_WIRE nil)\n        gnd=dbCreateInst(cv gndMaster strcat(name "_GND") minus "R0")\n        unless(gnd error("{p}: cannot create GND for VDC %s.\\n" name))\n        printf("{p}: VDC %s = %sV PLUS=%s MINUS=GND\\n" name value plusNet)\n        inst\n    )\n)\n'''
              block=block.replace(sig,f'procedure({p}_CreateVDC(cv master gndMaster name xy value plusNet)',1).replace(body.group(0),new_body,1)
              text=text[:start]+block+text[end:]
              if 'gndMaster=' not in text:
                  text,n=re.subn(r'(let\(\(cv [^\n]*?vdcMaster) (pinMaster)',r'\1 gndMaster \2',text,count=1)
                  if n!=1: failed.append((str(path),'gndMaster let insertion failed')); continue
              text,n=re.subn(rf'(vdcMaster={re.escape(p)}_OpenMaster\("analogLib" "vdc"\)\n)(\s*)(pinMaster={re.escape(p)}_OpenMaster)',rf'\1        gndMaster={p}_OpenMaster("analogLib" "gnd")\n\2\3',text,count=1)
              if n!=1: failed.append((str(path),'gndMaster master insertion failed')); continue
              text,n=re.subn(rf'{re.escape(p)}_CreateVDC\(cv vdcMaster ([^\n]*?) "VSS"\)',lambda x:f'{p}_CreateVDC(cv vdcMaster gndMaster {x.group(1)})',text)
              if n==0: failed.append((str(path),'no VDC calls updated')); continue
              path.write_text(text,encoding='utf-8'); changed.append(str(path))
          print('CHANGED',len(changed))
          for x in changed: print(x)
          print('FAILED',len(failed))
          for x in failed: print(x)
          if failed: raise SystemExit(2)

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import re
          bad=[]; total=0
          for p in Path('canonical').rglob('*.il'):
              t=p.read_text(encoding='utf-8')
              for m in re.finditer(r'procedure\((\w+)_CreateVDC\(cv master gndMaster name xy value plusNet\).*?(?=\nprocedure\(|\Z)',t,re.S):
                  total+=1; b=m.group(0)
                  if not all(x in b for x in ['gndMaster','strcat(name "_GND")','list(plus ep)']) or any(x in b for x in ['minusNet','list(minus em)','wm=schCreateWire']): bad.append(str(p))
          print('VALIDATED',total)
          if bad:
              print('BAD',*bad,sep='\n'); raise SystemExit(3)

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Migrate remaining canonical VSS sources to analogLib GND [skip vss-gnd]"
          git push origin HEAD:vss-gnd-bulk-update
