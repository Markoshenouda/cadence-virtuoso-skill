name: Migrate canonical VSS sources to analogLib GND

on:
  push:
    branches: [vss-gnd-bulk-update]

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[skip vss-gnd]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migrate Cascode amplifier pair
        shell: python
        run: |
          from pathlib import Path
          import re
          targets = [Path('canonical/amplifier/CascodeAmp_NMOS_TotalW_V1_20260817.il'), Path('canonical/amplifier/CascodeAmp_PMOS_TotalW_V1_20260817.il')]
          changed=[]
          for path in targets:
              text=path.read_text(encoding='utf-8')
              m=re.search(r'procedure\((\w+)_CreateVDC\(cv master name xy value plusNet minusNet\)',text)
              if not m: raise SystemExit(f'{path}: legacy CreateVDC signature not found')
              p=m.group(1); old=f'procedure({p}_CreateVDC(cv master name xy value plusNet minusNet)'; new=f'procedure({p}_CreateVDC(cv master gndMaster name xy value plusNet)'
              start=text.find(old); nxt=text.find('\nprocedure(',start+len(old)); end=len(text) if nxt<0 else nxt; block=text[start:end]
              body=re.search(r'let\(\(inst plus minus ep em wp wm\)\n.*?printf\("[^"\n]*VDC %s = %sV PLUS=%s MINUS=%s\\n" name value plusNet minusNet\)\n        inst\n    \)\n\)\n',block,re.S)
              if not body: raise SystemExit(f'{path}: legacy CreateVDC body not found')
              nb=f'''let((inst gnd plus minus ep wp)\n        inst=dbCreateInst(cv master name xy "R0")\n        unless(inst error("{p}: cannot create VDC %s.\\n" name))\n        {p}_SetVDC(inst value)\n        plus={p}_VDCPinCenter(inst "PLUS")\n        minus={p}_VDCPinCenter(inst "MINUS")\n        ep=list(car(plus) cadr(plus)+{p}_STUB)\n        wp=schCreateWire(cv "route" "full" list(plus ep) {p}_WIRE {p}_WIRE 0)\n        unless(wp error("{p}: VDC PLUS wiring failed for %s.\\n" name))\n        schCreateWireLabel(cv car(wp) ep plusNet "lowerLeft" "R0" "stick" {p}_WIRE nil)\n        gnd=dbCreateInst(cv gndMaster strcat(name "_GND") minus "R0")\n        unless(gnd error("{p}: cannot create GND for VDC %s.\\n" name))\n        printf("{p}: VDC %s = %sV PLUS=%s MINUS=GND\\n" name value plusNet)\n        inst\n    )\n)\n'''
              block=block.replace(old,new,1).replace(body.group(0),nb,1); text=text[:start]+block+text[end:]
              if 'gndMaster=' not in text:
                  text,n=re.subn(r'(let\(\(cv [^\n]*?vdcMaster) (pinMaster)',r'\1 gndMaster \2',text,count=1)
                  if n!=1: raise SystemExit(f'{path}: failed gndMaster let binding')
              text,n=re.subn(rf'(vdcMaster={re.escape(p)}_OpenMaster\("analogLib" "vdc"\)\n)(\s*)(pinMaster={re.escape(p)}_OpenMaster)',rf'\1        gndMaster={p}_OpenMaster("analogLib" "gnd")\n\2\3',text,count=1)
              if n!=1: raise SystemExit(f'{path}: failed analogLib/gnd master')
              text,n=re.subn(rf'{re.escape(p)}_CreateVDC\(cv vdcMaster ([^\n]*?) "VSS"\)',lambda x:f'{p}_CreateVDC(cv vdcMaster gndMaster {x.group(1)})',text)
              if n==0: raise SystemExit(f'{path}: no VDC call updated')
              path.write_text(text,encoding='utf-8'); changed.append((str(path),n))
          print('Migrated:',changed)

      - name: Validate Cascode pair
        shell: python
        run: |
          from pathlib import Path
          import re
          for path in [Path('canonical/amplifier/CascodeAmp_NMOS_TotalW_V1_20260817.il'),Path('canonical/amplifier/CascodeAmp_PMOS_TotalW_V1_20260817.il')]:
              t=path.read_text(encoding='utf-8'); m=re.search(r'procedure\((\w+)_CreateVDC\(cv master gndMaster name xy value plusNet\).*?(?=\nprocedure\(|\Z)',t,re.S)
              if not m: raise SystemExit(f'{path}: migrated CreateVDC missing')
              b=m.group(0)
              if any(x not in b for x in ['gndMaster','strcat(name "_GND")','list(plus ep)']): raise SystemExit(f'{path}: required GND contract missing')
              if any(x in b for x in ['minusNet','list(minus em)','wm=schCreateWire']): raise SystemExit(f'{path}: forbidden VSS/minus wire remains')
          print('Cascode pair validation: PASS')

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/amplifier/CascodeAmp_NMOS_TotalW_V1_20260817.il canonical/amplifier/CascodeAmp_PMOS_TotalW_V1_20260817.il
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Migrate Cascode amplifier VSS sources to analogLib GND [skip vss-gnd]"
          git push
