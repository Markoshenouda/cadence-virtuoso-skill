name: Normalize canonical VSS source termination

on:
  push:
    branches: [vss-gnd-bulk-update]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Normalize and validate canonical VDC generators
        run: python scripts/migrate_canonical_vss_gnd.py

      - name: Commit normalization from push event
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical
          if git diff --cached --quiet; then
            echo "No canonical normalization changes required."
            exit 0
          fi
          git commit -m "Apply VSS-only VDC termination contract [skip vss-gnd]"
          git push
