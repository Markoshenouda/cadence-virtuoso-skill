name: Normalize canonical VSS source termination

on:
  push:
    branches: [vss-gnd-bulk-update]

permissions:
  contents: write

jobs:
  normalize:
    if: "!contains(github.event.head_commit.message, '[skip vss-gnd]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize only VSS-source VDC MINUS terminals
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("canonical")
          changed = []

          def migrate_block(path, text, prefix, block):
              # Current broad migration shape: every VDC is wired to GND.
              if f"procedure({prefix}_CreateVDC(cv master gndMaster name xy value plusNet)" not in block:
                  return block, False

              wire_m = re.search(
                  r'wp=schCreateWire\(cv "route" "full" list\(plus ep\) ([A-Za-z0-9_]+) \\1 0\)',
                  block,
              )
              if not wire_m:
                  raise SystemExit(f"{path}: {prefix}: cannot determine PLUS wire width")
              wire = wire_m.group(1)

              body = f'''let((inst gnd plus minus ep em wp wm)\n        inst=dbCreateInst(cv master name xy "R0")\n        unless(inst error("{prefix}: cannot create VDC %s.\\n" name))\n        {prefix}_SetVDC(inst value)\n        plus={prefix}_VDCPinCenter(inst "PLUS")\n        minus={prefix}_VDCPinCenter(inst "MINUS")\n        ep=list(car(plus) cadr(plus)+{prefix}_STUB)\n        wp=schCreateWire(cv "route" "full" list(plus ep) {wire} {wire} 0)\n        unless(wp error("{prefix}: VDC PLUS wiring failed for %s.\\n" name))\n        schCreateWireLabel(cv car(wp) ep plusNet "lowerLeft" "R0" "stick" {wire} nil)\n        if(equal(minusNet "GND") then\n            gnd=dbCreateInst(cv gndMaster strcat(name "_GND") minus "R0")\n            unless(gnd error("{prefix}: cannot create GND for VDC %s.\\n" name))\n            else\n            em=list(car(minus) cadr(minus)-{prefix}_STUB)\n            wm=schCreateWire(cv "route" "full" list(minus em) {wire} {wire} 0)\n            unless(wm error("{prefix}: VDC MINUS wiring failed for %s.\\n" name))\n            schCreateWireLabel(cv car(wm) em minusNet "lowerLeft" "R0" "stick" {wire} nil)\n        )\n        printf("{prefix}: VDC %s = %sV PLUS=%s MINUS=%s\\n" name value plusNet minusNet)\n        inst\n    )\n)'''

              start = block.find(f"procedure({prefix}_CreateVDC")
              body_start = block.find("let((", start)
              block = block[:body_start] + body + "\n"
              block = block.replace(
                  f"procedure({prefix}_CreateVDC(cv master gndMaster name xy value plusNet)",
                  f"procedure({prefix}_CreateVDC(cv master gndMaster name xy value plusNet minusNet)",
                  1,
              )
              return block, True

          for path in sorted(root.rglob("*.il")):
              text = path.read_text(encoding="utf-8")
              original = text

              matches = list(re.finditer(r'procedure\((\w+)_CreateVDC\(', text))
              for match in reversed(matches):
                  prefix = match.group(1)
                  next_proc = text.find("\nprocedure(", match.end())
                  end = len(text) if next_proc < 0 else next_proc
                  block = text[match.start():end]
                  new_block, did = migrate_block(path, text, prefix, block)
                  if did:
                      text = text[:match.start()] + new_block + text[end:]

              if text != original:
                  changed.append(str(path))

              # All canonical generators touched by the previous migration pass
              # already have gndMaster in their generator scope. Keep it present.
              if "CreateVDC(cv vdcMaster gndMaster" in text and "gndMaster=" not in text:
                  raise SystemExit(f"{path}: gndMaster call found but no gndMaster binding")

              # Convert VDC calls to explicit MINUS behavior:
              #   VSS source -> GND
              #   every other source -> VSS (legacy behavior)
              def call_repl(m):
                  prefix = m.group(1)
                  args = m.group(2)
                  if re.search(r'"VSS"\s*$', args):
                      return f'{prefix}_CreateVDC(cv vdcMaster gndMaster {args} "GND")'
                  if re.search(r'"GND"\s*$', args):
                      return m.group(0)
                  return f'{prefix}_CreateVDC(cv vdcMaster gndMaster {args} "VSS")'

              text = re.sub(
                  r'(?m)^\s*(\w+)_CreateVDC\(cv vdcMaster ([^\n]*)\)$',
                  lambda m: call_repl(m),
                  text,
              )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  if str(path) not in changed:
                      changed.append(str(path))

          print("NORMALIZED:")
          for item in changed:
              print("  " + item)

      - name: Validate VSS-only contract
        shell: python
        run: |
          from pathlib import Path
          import re

          failures = []
          checked = 0
          for path in sorted(Path("canonical").rglob("*.il")):
              text = path.read_text(encoding="utf-8")
              matches = list(re.finditer(r'procedure\((\w+)_CreateVDC\(', text))
              if not matches:
                  continue
              checked += 1
              for match in matches:
                  prefix = match.group(1)
                  next_proc = text.find("\nprocedure(", match.end())
                  block = text[match.start(): len(text) if next_proc < 0 else next_proc]
                  if f"procedure({prefix}_CreateVDC(cv master gndMaster name xy value plusNet minusNet)" not in block:
                      failures.append(f"{path}: {prefix}: CreateVDC signature is not explicit about MINUS")
                  if 'strcat(name "_GND")' not in block:
                      failures.append(f"{path}: {prefix}: VSS/GND branch has no unique GND name")
                  if 'if(equal(minusNet "GND") then' not in block:
                      failures.append(f"{path}: {prefix}: missing VSS-only GND branch")
                  if 'wm=schCreateWire' not in block or 'minusNet' not in block:
                      failures.append(f"{path}: {prefix}: legacy non-VSS MINUS wiring is missing")

              for call in re.finditer(r'(?m)^\s*(\w+)_CreateVDC\(cv vdcMaster gndMaster ([^\n]*)\)$', text):
                  args = call.group(2)
                  if args.rstrip().endswith('"VSS"'):
                      failures.append(f"{path}: VDC call still has VSS as explicit MINUS; expected VSS-source call to use GND")
                  elif not args.rstrip().endswith('"GND"'):
                      failures.append(f"{path}: VDC call lacks explicit GND/VSS MINUS contract")

          print(f"Checked {checked} canonical VDC generator files")
          if failures:
              print("VALIDATION FAILURES:")
              for failure in failures:
                  print("  " + failure)
              raise SystemExit(1)
          print("Canonical VSS-only validation: PASS")

      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical
          if git diff --cached --quiet; then
            echo "No canonical normalization changes were required."
            exit 0
          fi
          git commit -m "Restrict analogLib GND termination to VSS sources [skip vss-gnd]"
          git push
